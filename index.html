<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التاج الذهبي للنشر الآمن</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; padding: 20px; text-align: center; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 0 auto; }
        h2 { color: #075E54; }
        textarea { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; resize: none; }
        button { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 5px; margin-top: 15px; cursor: pointer; }
        .btn-main { background-color: #25D366; }
        .btn-sub { background-color: #4f5d64; width: 48%; float: right; }
        .btn-skip { background-color: #e15b64; width: 48%; float: left; }
        .status { margin-top: 15px; font-size: 16px; font-weight: bold; color: #333; white-space: pre-line; }
        .nav-box { overflow: hidden; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👑 التاج الذهبي للنشر والمجموعات 👑</h2>
        <div class="status" id="statusText">مستعد لبدء حملة الـ 1000 رسالة</div>
        
        <textarea id="listInput" rows="4" placeholder="أدخل روابط المجموعات أو الأرقام الفردية (كل رابط أو رقم في سطر)..."></textarea>
        <textarea id="messageInput" rows="5" placeholder="اكتب نص الرسالة أو التوجيه هنا..."></textarea>
        
        <button class="btn-main" onclick="sendToCurrentTarget()">🚀 تجهيز وإرسال للهدف الحالي</button>
        
        <div class="nav-box">
            <button class="btn-sub" onclick="goPrevious()">⬅️ السابق</button>
            <button class="btn-skip" onclick="goNext()">تخطي ➡️</button>
        </div>
    </div>

    <script>
        let targets = [];
        let currentIndex = 0;

        if (localStorage.getItem('savedIndex')) {
            currentIndex = parseInt(localStorage.getItem('savedIndex'));
        }

        function updateUI() {
            parseTargets();
            if (targets.length === 0) {
                document.getElementById('statusText').innerText = "يرجى إدخال أرقام أو روابط مجموعات أولاً";
                return;
            }
            if (currentIndex < targets.length) {
                document.getElementById('statusText').innerText = `الهدف الحالي: ${targets[currentIndex]} \n الترتيب: (${currentIndex + 1} من ${targets.length})`;
            } else {
                document.getElementById('statusText').innerText = `🎉 اكتملت الحملة بنجاح! (${targets.length} هدف)`;
            }
        }

        function parseTargets() {
            let rawInput = document.getElementById('listInput').value;
            targets = rawInput.split('\n').map(t => t.trim()).filter(t => t.length > 0);
        }

        function sendToCurrentTarget() {
            parseTargets();
            if (currentIndex >= targets.length) {
                alert("اكتملت الحملة بالكامل!");
                return;
            }

            let target = targets[currentIndex];
            let msg = encodeURIComponent(document.getElementById('messageInput').value);
            let url = "";

            if (target.includes("://whatsapp.com") || target.includes("whatsapp.com")) {
                url = target + "?text=" + msg;
            } else {
                let cleanNum = target.replace(/[^0-9]/g, '');
                if (!cleanNum.startsWith("967")) cleanNum = "967" + cleanNum;
                url = `https://whatsapp.com{cleanNum}&text=${msg}`;
            }

            window.open(url, '_blank');
            currentIndex++;
            localStorage.setItem('savedIndex', currentIndex);
            updateUI();
        }

        function goNext() {
            parseTargets();
            if (currentIndex < targets.length) {
                currentIndex++;
                localStorage.setItem('savedIndex', currentIndex);
                updateUI();
            }
        }

        function goPrevious() {
            if (currentIndex > 0) {
                currentIndex--;
                localStorage.setItem('savedIndex', currentIndex);
                updateUI();
            }
        }

        document.getElementById('listInput').addEventListener('input', updateUI);
    </script>
</body>
</html>
