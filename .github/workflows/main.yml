name: Ultimate WhatsApp Group Broadcaster

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Custom WhatsApp App Files
        run: |
          mkdir -p app/src/main/java/com/ultimate/whatsapp/broadcaster
          mkdir -p app/src/main/res/layout
          
          # 1. ملف بناء إعدادات الأندرويد المستقرة
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.4.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 2. ملف تخصيص حزم التطبيق
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ultimate.whatsapp.broadcaster'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ultimate.whatsapp.broadcaster"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
          }
          EOF

          # 3. واجهة التحكم بالتحديد والنشر للمجموعات
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">
              <TextView android:id="@+id/statusText" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="نظام البث الآمن للمجموعات ومقاومة الحظر" android:textSize="16sp" android:gravity="center" android:layout_marginBottom="15dp" android:textColor="#128C7E"/>
              <EditText android:id="@+id/groupsInput" android:layout_width="match_parent" android:layout_height="100dp" android:hint="أدخل روابط المجموعات (كل رابط في سطر)..." android:gravity="top|right" android:inputType="textMultiLine"/>
              <EditText android:id="@+id/messageInput" android:layout_width="match_parent" android:layout_height="120dp" android:hint="اكتب نص الرسالة أو التحويل هنا..." android:gravity="top|right" android:inputType="textMultiLine" android:layout_marginTop="10dp"/>
              <Button android:id="@+id/btnStartBroadcast" android:layout_width="match_parent" android:layout_height="55dp" android:text="بدء النشر الجماعي المستقر" android:backgroundTint="#075E54" android:textColor="#FFFFFF" android:layout_marginTop="15dp"/>
              <TextView android:id="@+id/progressText" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="التقدم: 0 / 0" android:gravity="center" android:layout_marginTop="15dp"/>
          </LinearLayout>
          EOF

          # 4. كود الجافا الذكي المانع للانهيار والمحافظ على الجلسة بعد الحظر المتكرر
          cat << 'EOF' > app/src/main/java/com/ultimate/whatsapp/broadcaster/MainActivity.java
          package com.ultimate.whatsapp.broadcaster;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.net.URLEncoder;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              private EditText groupsInput, messageInput;
              private TextView progressText;
              private ArrayList<String> groupsList = new ArrayList<>();
              private int currentGroupIndex = 0;
              private SharedPreferences sessionDatabase;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  Thread.setDefaultUncaughtExceptionHandler((thread, throwable) -> {
                      Intent intent = new Intent(MainActivity.this, MainActivity.class);
                      startActivity(intent);
                      System.exit(1);
                  });

                  groupsInput = findViewById(R.id.groupsInput);
                  messageInput = findViewById(R.id.messageInput);
                  progressText = findViewById(R.id.progressText);
                  Button btnStartBroadcast = findViewById(R.id.btnStartBroadcast);

                  sessionDatabase = getSharedPreferences("SecureWhatsAppSession", Context.MODE_PRIVATE);
                  currentGroupIndex = sessionDatabase.getInt("savedGroupIndex", 0);

                  btnStartBroadcast.setOnClickListener(v -> {
                      parseGroups();
                      if (currentGroupIndex < groupsList.size()) {
                          broadcastToNextGroup();
                      } else {
                          Toast.makeText(this, "اكتمل النشر في كافة المجموعات بنجاح!", Toast.LENGTH_LONG).show();
                      }
                  });
              }

              private void parseGroups() {
                  String[] lines = groupsInput.getText().toString().split("\n");
                  groupsList.clear();
                  for (String line : lines) {
                      if (!line.trim().isEmpty()) groupsList.add(line.trim());
                  }
              }

              private void broadcastToNextGroup() {
                  try {
                      String groupUrl = groupsList.get(currentGroupIndex);
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      String encodedMsg = URLEncoder.encode(messageInput.getText().toString(), "UTF-8");
                      intent.setData(Uri.parse(groupUrl + "?text=" + encodedMsg));
                      startActivity(intent);
                      
                      currentGroupIndex++;
                      sessionDatabase.edit().putInt("savedGroupIndex", currentGroupIndex).apply();
                      progressText.setText("المجموعة الحالية: " + currentGroupIndex + " من " + groupsList.size());
                  } catch (Exception e) {
                      currentGroupIndex++;
                      broadcastToNextGroup();
                  }
              }
          }
          EOF

          # 5. ملف الصلاحيات وتجهيز واجهة الأندرويد الرسمية
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="التاج الذهبي للنشر" android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "include ':app'" > settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-WhatsApp-Broadcaster
          path: "app/build/outputs/apk/debug/*.apk"
